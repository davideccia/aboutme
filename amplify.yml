version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - npm install -g pnpm@12.15.0
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .astro/**/*
